apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-managed-identity-app
  labels:
    app: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
      - name: app
        image: mcr.microsoft.com/oss/nginx/nginx:1.19.5
        ports:
        - containerPort: 80
